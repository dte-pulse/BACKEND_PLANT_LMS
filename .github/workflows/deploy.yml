name: Deploy Plant-LMS Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}

          script: |
            set -e

            echo "========================================"
            echo "Starting Plant-LMS Backend deployment"
            echo "========================================"

            cd /var/www/plant_lms_backend

            echo "Pulling latest code..."
            git pull origin main

            echo "Installing dependencies..."
            /var/www/plant_lms_backend/venv/bin/python -m pip install -r requirements.txt

            echo "Restarting Plant-LMS backend..."
            sudo -n /usr/bin/systemctl restart plant_lms_backend

            echo "Checking service status..."
            sudo -n /usr/bin/systemctl status plant_lms_backend --no-pager

            echo "========================================"
            echo "Deployment completed successfully"
            echo "========================================"
